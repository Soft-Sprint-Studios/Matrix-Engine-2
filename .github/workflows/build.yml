name: Build Matrix Engine 2

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Build - Windows x64 (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B pathos/sources/codesrc/build_windows_x64 -S pathos/sources/codesrc -G "Visual Studio 18 2026" -A x64

      - name: Build with CMake
        run: |
          cmake --build pathos/sources/codesrc/build_windows_x64 --config Release --parallel

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matrix-engine-windows-x64-Release
          path: |
            matrix-engine.exe
            pathos/dlls/client_x64.dll
            pathos/dlls/game_x64.dll

  build-linux:
    name: Build - Linux x64 (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Latest CMake
        uses: lukka/get-cmake@latest

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libegl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -S pathos/sources/codesrc -B pathos/sources/codesrc/build_linux_x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build with CMake
        run: |
          cmake --build pathos/sources/codesrc/build_linux_x64 --parallel $(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matrix-engine-linux-x64-Release
          path: |
            matrix-engine
            pathos/dlls/client_x64.so
            pathos/dlls/game_x64.so

  create-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows x64 Release
        uses: actions/download-artifact@v4
        with:
          name: matrix-engine-windows-x64-Release
          path: artifacts/windows-x64

      - name: Download Linux x64 Release
        uses: actions/download-artifact@v4
        with:
          name: matrix-engine-linux-x64-Release
          path: artifacts/linux-x64

      - name: Create archives
        run: |
          mkdir -p release
          cd artifacts
          zip -r ../release/windows-x64.zip windows-x64
          tar -czvf ../release/linux-x64.tar.gz linux-x64

      - name: Recreate release tag
        run: |
          git tag -f automated-release
          git push origin automated-release --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: automated-release
          name: Automated Release
          body: |
            Build Date: ${{ github.event.head_commit.timestamp }}
          files: |
            release/windows-x64.zip
            release/linux-x64.tar.gz